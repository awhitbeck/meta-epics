# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-epics"
BBFILE_PATTERN_meta-epics = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-epics = "6"

LAYERDEPENDS_meta-epics = "core"
LAYERSERIES_COMPAT_meta-epics = "scarthgap langdale kirkstone"

# addpylib is only available in BitBake >= 2.4.0 (mickledore/scarthgap).
# For compatibility with BitBake 2.2.0 (kirkstone/langdale, e.g. PetaLinux 2024.1),
# the python library path is registered in epics-functions.bbclass instead.
